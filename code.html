<!-- Interactive Logic -->
<script>
        const statusLogs = [
            "신체 비율 분석 중...",
            "피부 언더톤 분석 중...",
            "시즌 트렌드 대조 중...",
            "지속 가능한 소재 선별 중...",
            "에디토리얼 필터 적용 중...",
            "아틀리에 룩북 완성 중..."
        ];
        
        let currentLogIndex = 0;
        const logContent = document.getElementById('log-content');
        const progressBar = document.getElementById('progress-bar');
        
        function updateStatus() {
            currentLogIndex = (currentLogIndex + 1) % statusLogs.length;
            
            // Fade out effect
            logContent.style.opacity = '0';
            logContent.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                logContent.innerText = statusLogs[currentLogIndex];
                logContent.style.opacity = '1';
                logContent.style.transform = 'translateY(0)';
                
                // Update progress bar width simulate progress
                const progress = ((currentLogIndex + 1) / statusLogs.length) * 100;
                progressBar.style.width = `${progress}%`;
            }, 500);
        }

        // Cycle status every 3 seconds
        setInterval(updateStatus, 3000);

        // Initial Progress
        progressBar.style.width = '15%';
    </script>
